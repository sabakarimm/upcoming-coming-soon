<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8B84A">
<title>Upcoming: See What's Coming Up</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #1A1814;
  }
  body {
    background:
      radial-gradient(1200px 700px at 12% 18%, rgba(255,248,230,0.95), transparent 55%),
      radial-gradient(900px 600px at 88% 78%, rgba(196,138,42,0.45), transparent 50%),
      linear-gradient(155deg, #F6E7B0 0%, #F3C455 42%, #E0A52E 100%);
  }
  .glow {
    position: fixed;
    inset: auto auto 8% 42%;
    width: min(55vw, 520px);
    height: min(55vw, 520px);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.35), transparent 68%);
    filter: blur(8px);
    pointer-events: none;
    z-index: 0;
  }
  .cover {
    position: relative;
    z-index: 1;
    height: 100dvh;
    max-height: 100vh;
    width: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    align-items: center;
    gap: clamp(1.5rem, 5vw, 4rem);
    padding: max(1.5rem, env(safe-area-inset-top)) clamp(1.4rem, 6vw, 5rem) max(1.4rem, env(safe-area-inset-bottom));
  }
  .copy { max-width: 32rem; }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 1.5rem;
  }
  .brand img {
    width: 2.7rem;
    height: 2.7rem;
    object-fit: contain;
    filter: drop-shadow(0 6px 16px rgba(26,24,20,0.18));
  }
  .brand span {
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: -0.04em;
  }
  h1 {
    font-size: clamp(2.05rem, 5vw, 3.55rem);
    line-height: 1.02;
    letter-spacing: -0.055em;
    font-weight: 780;
    margin-bottom: 1.15rem;
    text-wrap: balance;
  }
  .soon {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.78rem;
    font-weight: 750;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.55rem 0.9rem;
    border-radius: 999px;
    color: #F8EFC8;
    background: rgba(26,24,20,0.92);
    box-shadow: 0 10px 28px rgba(26,24,20,0.18);
  }
  .soon::before {
    content: "";
    width: 0.45rem;
    height: 0.45rem;
    border-radius: 50%;
    background: #F3C455;
    box-shadow: 0 0 0 3px rgba(243,196,85,0.28);
  }
  .stage {
    justify-self: end;
    display: flex;
    align-items: center;
    justify-content: center;
    height: min(82dvh, 760px);
    width: 100%;
  }
  .device {
    position: relative;
    height: 100%;
    aspect-ratio: 9 / 19.4;
    max-width: min(100%, 340px);
    transform: rotate(3.5deg) translateY(0.5rem);
    filter: drop-shadow(0 34px 50px rgba(26,24,20,0.35));
  }
  .bezel {
    position: absolute;
    inset: 0;
    border-radius: 2.15rem;
    background: linear-gradient(160deg, #2a2926, #0d0d0c 55%, #1a1917);
    padding: 0.55rem;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.12),
      inset 0 0 0 2px rgba(0,0,0,0.55);
  }
  .screen {
    width: 100%;
    height: 100%;
    border-radius: 1.7rem;
    overflow: hidden;
    background: #000;
    display: block;
    object-fit: cover;
    object-position: top center;
  }
  .island {
    position: absolute;
    top: 0.95rem;
    left: 50%;
    transform: translateX(-50%);
    width: 28%;
    height: 1.05rem;
    border-radius: 999px;
    background: #000;
    z-index: 2;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
  }
  @media (max-width: 860px) {
    .cover {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      justify-items: center;
      text-align: center;
      gap: 1.1rem;
      padding-top: max(1.1rem, env(safe-area-inset-top));
      padding-bottom: max(0.8rem, env(safe-area-inset-bottom));
    }
    .brand { justify-content: center; margin-bottom: 0.9rem; }
    .copy { max-width: 24rem; }
    h1 { font-size: clamp(1.8rem, 7.2vw, 2.45rem); margin-bottom: 0.9rem; }
    .stage {
      justify-self: center;
      height: min(58dvh, 540px);
    }
    .device {
      transform: rotate(2deg);
      max-width: min(100%, 280px);
    }
  }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main class="cover">
    <div class="copy">
      <div class="brand">
        <img src="assets/logo-mark.png" alt="" width="43" height="43">
        <span>upcoming</span>
      </div>
      <h1>Upcoming: See What&rsquo;s Coming Up</h1>
      <p class="soon">Coming soon</p>
    </div>
    <div class="stage">
      <div class="device" aria-hidden="false">
        <div class="bezel">
          <span class="island"></span>
          <img class="screen" src="assets/phone.png" alt="Upcoming app screenshot">
        </div>
      </div>
    </div>
  </main>
</body>
</html>
